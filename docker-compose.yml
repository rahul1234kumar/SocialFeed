# Local infrastructure for SocialFeed.
#   docker compose up -d                     -> only MySQL (run the app from IntelliJ)
#   docker compose --profile app up --build  -> MySQL + the app in a container
# Values like ${DB_PASSWORD} come from the .env file next to this one.
name: socialfeed

services:
  mysql:
    image: mysql:8.4
    container_name: socialfeed-mysql
    environment:
      # Read by the MySQL image only on the FIRST start (empty data volume).
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      # host:container. 3306 on the host is your local MySQL, so use 3307.
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ stops compose from substituting; the container's shell expands it.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    profiles: ["app"]
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Inside the compose network, MySQL is reachable by its service name.
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
