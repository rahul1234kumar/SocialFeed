spring:
  application:
    name: SocialFeed
  datasource:
    url: jdbc:mysql://localhost:3306/socialfeed
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    secret: socialfeed-secret-key-must-be-at-least-32-chars-long
    expiration: 86400000